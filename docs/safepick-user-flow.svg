<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">SafePick 서비스 및 UI 흐름</title>
  <desc id="desc">상품 링크 입력부터 분석 진행, 공식 정보 비교, 위험 신호, 분석 결과 저장까지의 사용자 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#54708f"/></marker>
    <style>
      .bg { fill:#f8fafc; } .title { fill:#172033; font:700 42px Arial,'Malgun Gothic',sans-serif; } .sub { fill:#64748b; font:400 20px Arial,'Malgun Gothic',sans-serif; }
      .card { fill:#ffffff; stroke:#cbd5e1; stroke-width:2; } .active { fill:#eaf2ff; stroke:#1d6fe8; stroke-width:3; } .future { fill:#f5f3ff; stroke:#8b5cf6; stroke-width:2; stroke-dasharray:7 5; }
      .number { fill:#1d6fe8; } .futureNumber { fill:#7c3aed; } .numText { fill:#ffffff; font:700 19px Arial,sans-serif; } .head { fill:#172033; font:700 24px Arial,'Malgun Gothic',sans-serif; } .copy { fill:#64748b; font:400 17px Arial,'Malgun Gothic',sans-serif; }
      .line { fill:none; stroke:#54708f; stroke-width:3; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1600" height="720" rx="28"/>
  <text class="title" x="90" y="85">SafePick 서비스 및 UI 흐름</text>
  <text class="sub" x="90" y="123">사용자가 상품 링크를 입력한 뒤 공식 정보와 위험 신호를 확인하고 결과를 저장하는 과정</text>
  <path class="line" d="M315 354 L365 354"/><path class="line" d="M575 354 L625 354"/><path class="line" d="M835 354 L885 354"/><path class="line" d="M1095 354 L1145 354"/>
  <rect class="active" x="90" y="250" width="225" height="210" rx="18"/>
  <circle class="number" cx="132" cy="293" r="22"/><text class="numText" x="126" y="300">1</text>
  <text class="head" x="120" y="345">링크 입력</text><text class="copy" x="120" y="378">쇼핑 상품 링크를</text><text class="copy" x="120" y="404">붙여 넣고 분석 시작</text>
  <rect class="active" x="365" y="250" width="210" height="210" rx="18"/>
  <circle class="number" cx="407" cy="293" r="22"/><text class="numText" x="401" y="300">2</text>
  <text class="head" x="395" y="345">분석 진행</text><text class="copy" x="395" y="378">판매 페이지 수집과</text><text class="copy" x="395" y="404">상품 정보 추출</text>
  <rect class="active" x="625" y="250" width="210" height="210" rx="18"/>
  <circle class="number" cx="667" cy="293" r="22"/><text class="numText" x="661" y="300">3</text>
  <text class="head" x="655" y="345">정보 보정</text><text class="copy" x="655" y="378">확인 불가 항목을</text><text class="copy" x="655" y="404">직접 수정·입력</text>
  <rect class="active" x="885" y="250" width="210" height="210" rx="18"/>
  <circle class="number" cx="927" cy="293" r="22"/><text class="numText" x="921" y="300">4</text>
  <text class="head" x="915" y="345">공식 정보 비교</text><text class="copy" x="915" y="378">공식 도메인 결과와</text><text class="copy" x="915" y="404">판매 정보 비교</text>
  <rect class="active" x="1145" y="250" width="225" height="210" rx="18"/>
  <circle class="number" cx="1187" cy="293" r="22"/><text class="numText" x="1181" y="300">5</text>
  <text class="head" x="1175" y="345">위험 신호·저장</text><text class="copy" x="1175" y="378">체크리스트 확인 후</text><text class="copy" x="1175" y="404">분석 결과 저장·다시 보기</text>
  <rect class="future" x="560" y="535" width="480" height="105" rx="18"/>
  <circle class="futureNumber" cx="605" cy="587" r="22"/><text class="numText" x="599" y="594">+</text>
  <text class="head" x="650" y="580">경진대회 확장 기능: AI 구매 전 질문 답변</text><text class="copy" x="650" y="610">분석 결과와 공식 출처를 근거로 사용자의 질문에 답변</text>
  <path class="line" d="M1257 460 C1257 540,1080 587,1042 587"/>
</svg>
