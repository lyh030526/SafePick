<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">SafePick 시스템 아키텍처</title>
  <desc id="desc">Expo 모바일 앱, FastAPI 분석 API, OpenAI, 공식 도메인 목록, Serper 검색 API, SQLite 데이터베이스의 처리 구조</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#456783"/></marker>
    <style>
      .bg { fill:#f8fafc; } .title { fill:#172033; font:700 42px Arial,'Malgun Gothic',sans-serif; } .sub { fill:#64748b; font:400 20px Arial,'Malgun Gothic',sans-serif; }
      .group { fill:#ffffff; stroke:#d9e2ec; stroke-width:2; } .client { fill:#eaf2ff; stroke:#1d6fe8; stroke-width:3; } .api { fill:#172b45; }
      .module { fill:#ffffff; stroke:#9db4cc; stroke-width:2; } .external { fill:#f8fbff; stroke:#7c9cc0; stroke-width:2; } .data { fill:#effaf3; stroke:#2d8a57; stroke-width:2; }
      .groupLabel { fill:#54708f; font:700 16px Arial,'Malgun Gothic',sans-serif; letter-spacing:1px; } .whiteLabel { fill:#dbeafe; font:700 16px Arial,'Malgun Gothic',sans-serif; letter-spacing:1px; }
      .head { fill:#172033; font:700 23px Arial,'Malgun Gothic',sans-serif; } .copy { fill:#475569; font:400 17px Arial,'Malgun Gothic',sans-serif; }
      .lightHead { fill:#ffffff; font:700 25px Arial,'Malgun Gothic',sans-serif; } .lightCopy { fill:#dbeafe; font:400 17px Arial,'Malgun Gothic',sans-serif; }
      .line { fill:none; stroke:#456783; stroke-width:3; marker-end:url(#arrow); } .return { fill:none; stroke:#7c9cc0; stroke-width:2.5; stroke-dasharray:9 7; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1600" height="1080" rx="28"/>
  <text class="title" x="90" y="85">SafePick 시스템 아키텍처</text>
  <text class="sub" x="90" y="123">상품 링크 분석, 공식 정보 비교, 위험 신호 분석, 결과 저장을 위한 기술 구성</text>
  <rect class="group" x="90" y="170" width="1420" height="190" rx="22"/>
  <text class="groupLabel" x="125" y="210">CLIENT</text>
  <rect class="client" x="285" y="230" width="1030" height="92" rx="16"/>
  <text class="head" x="330" y="270">Expo 모바일 앱</text>
  <text class="copy" x="600" y="270">링크 입력</text><text class="copy" x="770" y="270">분석 진행</text><text class="copy" x="950" y="270">공식 정보 비교</text><text class="copy" x="1150" y="270">위험 신호 · 저장 목록</text>
  <path class="line" d="M800 322 L800 432"/>
  <rect class="api" x="90" y="440" width="1420" height="275" rx="22"/>
  <text class="whiteLabel" x="125" y="480">APPLICATION SERVER</text>
  <text class="lightHead" x="125" y="525">FastAPI 백엔드</text>
  <text class="lightCopy" x="125" y="556">분석 요청 처리 · 공식 정보 비교 · 위험 신호 분석 · 결과 저장 및 조회</text>
  <rect class="module" x="125" y="590" width="275" height="86" rx="14"/>
  <text class="head" x="160" y="626">1. 링크 검증·수집</text><text class="copy" x="160" y="654">URL 보안 검사 · 공개 텍스트</text>
  <rect class="module" x="465" y="590" width="275" height="86" rx="14"/>
  <text class="head" x="500" y="626">2. 상품 정보 추출</text><text class="copy" x="500" y="654">브랜드 · 모델 · 가격 · 구성품</text>
  <rect class="module" x="805" y="590" width="275" height="86" rx="14"/>
  <text class="head" x="840" y="626">3. 공식 정보 비교</text><text class="copy" x="840" y="654">공식 검색 · 모델·가격·판매처</text>
  <rect class="module" x="1145" y="590" width="320" height="86" rx="14"/>
  <text class="head" x="1180" y="626">4. 위험 신호·저장</text><text class="copy" x="1180" y="654">체크리스트 · 결과 요약 · 다시 보기</text>
  <path class="line" d="M260 676 L260 815"/><path class="line" d="M600 676 L600 815"/><path class="line" d="M940 676 L940 815"/><path class="line" d="M1305 676 L1305 815"/>
  <rect class="group" x="90" y="790" width="1420" height="220" rx="22"/>
  <text class="groupLabel" x="125" y="830">EXTERNAL SERVICES AND DATA</text>
  <rect class="external" x="125" y="860" width="270" height="108" rx="16"/>
  <text class="head" x="160" y="905">판매 페이지</text><text class="copy" x="160" y="935">공개 HTML 텍스트</text>
  <rect class="external" x="465" y="860" width="270" height="108" rx="16"/>
  <text class="head" x="500" y="905">OpenAI API</text><text class="copy" x="500" y="935">추출 · 비교 · 위험 신호 · 요약</text>
  <rect class="external" x="805" y="860" width="270" height="108" rx="16"/>
  <text class="head" x="840" y="905">공식 도메인·검색 API</text><text class="copy" x="840" y="935">지원 브랜드 검증 · Serper 검색</text>
  <rect class="data" x="1145" y="860" width="320" height="108" rx="16"/>
  <text class="head" x="1180" y="905">SQLite 분석 결과 DB</text><text class="copy" x="1180" y="935">분석 결과 · 출처 · 위험 신호</text>
  <path class="return" d="M730 918 L805 918"/><path class="return" d="M1075 945 L1145 945"/>
</svg>
