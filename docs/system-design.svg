<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060" font-family="'Malgun Gothic','Apple SD Gothic Neo',Pretendard,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475652"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D8A72"/>
    </marker>
    <style>
      .title { font-size: 30px; font-weight: 800; fill: #13201D; }
      .subtitle { font-size: 16px; fill: #475652; }
      .zone { font-size: 18px; font-weight: 800; }
      .box { fill: #FFFFFF; stroke: #C9D6D2; stroke-width: 1.5; }
      .boxTeal { fill: #E3F4EF; stroke: #0D8A72; stroke-width: 1.5; }
      .boxAi { fill: #FFF4DE; stroke: #E0A23A; stroke-width: 1.5; }
      .boxRule { fill: #0D8A72; stroke: #0A6B59; stroke-width: 1.5; }
      .h { font-size: 15px; font-weight: 800; fill: #13201D; }
      .hw { font-size: 15px; font-weight: 800; fill: #FFFFFF; }
      .t { font-size: 12.5px; fill: #475652; }
      .tw { font-size: 12.5px; fill: #E3F4EF; }
      .tag { font-size: 11px; font-weight: 700; }
      .line { stroke: #475652; stroke-width: 1.6; fill: none; }
      .lineTeal { stroke: #0D8A72; stroke-width: 2; fill: none; }
      .lineDash { stroke: #82908C; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
      .label { font-size: 11.5px; fill: #475652; }
    </style>
  </defs>

  <rect width="1600" height="1060" fill="#F4F7F6"/>
  <text x="40" y="52" class="title">SafePick 시스템 설계도</text>
  <text x="40" y="80" class="subtitle">오픈마켓 판매 페이지의 판매자·가격·설명·리뷰를 확인해 구매 전 주의 수준을 알려 주는 서비스 · AI는 읽고 근거를 찾고, 판정은 규칙과 공공데이터가 한다</text>

  <!-- Zones -->
  <rect x="30" y="105" width="330" height="905" rx="18" fill="#EAF0EE"/>
  <text x="50" y="137" class="zone" fill="#0A6B59">① 사용자 기기 (클라이언트)</text>
  <rect x="385" y="105" width="800" height="905" rx="18" fill="#E6F2EE"/>
  <text x="405" y="137" class="zone" fill="#0A6B59">② 분석 서버 · Python FastAPI (Render 클라우드)</text>
  <rect x="1210" y="105" width="360" height="905" rx="18" fill="#EAF0EE"/>
  <text x="1230" y="137" class="zone" fill="#0A6B59">③ 외부 서비스 · 공공데이터</text>

  <!-- Clients -->
  <rect x="50" y="158" width="290" height="230" rx="14" class="boxTeal"/>
  <text x="68" y="186" class="h">안드로이드 앱 (React Native · Expo)</text>
  <text x="68" y="212" class="t">• 홈 · 기록 · 마이 하단 탭</text>
  <text x="68" y="234" class="t">• 쿠팡 앱 '공유 → SafePick' 수신</text>
  <text x="68" y="256" class="t">• 앱 안 쿠팡 브라우저(WebView)</text>
  <text x="80" y="276" class="t">  + 페이지 수집기 자동 실행</text>
  <text x="68" y="298" class="t">• 결과 화면 · 체크리스트 · 질의응답</text>
  <text x="68" y="320" class="t">• 판매자 대화 캡처 확인</text>
  <text x="68" y="342" class="t">• 카카오 · Google 로그인</text>
  <text x="68" y="364" class="t">• 설치: EAS 빌드 APK</text>

  <rect x="50" y="405" width="290" height="120" rx="14" class="box"/>
  <text x="68" y="433" class="h">웹 앱 (같은 코드, 브라우저용)</text>
  <text x="68" y="459" class="t">• 링크 입력 · 설명 · 캡처 첨부</text>
  <text x="68" y="481" class="t">• 여러 판매처 비교 결과 화면</text>
  <text x="68" y="503" class="t">• 분석 기록 · 관심 판매처</text>

  <rect x="50" y="542" width="290" height="150" rx="14" class="box"/>
  <text x="68" y="570" class="h">크롬 확장 프로그램 (PC)</text>
  <text x="68" y="596" class="t">• 보고 있는 판매 페이지 수집</text>
  <text x="80" y="616" class="t">판매자 표 · 배송/반품 · 상품 문의</text>
  <text x="80" y="636" class="t">· 낮은 별점 리뷰 · 대표 사진</text>
  <text x="68" y="658" class="t">• 같은 상품 판매처 2~10곳 비교</text>
  <text x="68" y="680" class="t">• 네이버 · 11번가 · 쿠팡 · G마켓</text>

  <rect x="50" y="709" width="290" height="120" rx="14" class="box"/>
  <text x="68" y="737" class="h">공통 수집기 (collector.js)</text>
  <text x="68" y="763" class="t">확장 프로그램과 앱 브라우저가 같은</text>
  <text x="68" y="785" class="t">코드로 화면에 보이는 공개 정보만 읽음</text>
  <text x="68" y="807" class="t">(로그인·결제 정보는 읽지 않음)</text>

  <rect x="50" y="846" width="290" height="148" rx="14" class="box"/>
  <text x="68" y="874" class="h">입력 방법</text>
  <text x="68" y="900" class="t">• 판매 페이지 링크</text>
  <text x="68" y="922" class="t">• 쿠팡 앱 공유 · 복사한 링크</text>
  <text x="68" y="944" class="t">• 상품 설명 붙여넣기 · 캡처 3장</text>
  <text x="68" y="966" class="t">• 판매자 대화 캡처 4장 · 대화 텍스트</text>

  <!-- Server: endpoints -->
  <rect x="405" y="158" width="760" height="78" rx="14" class="box"/>
  <text x="423" y="184" class="h">API 엔드포인트 · 요청 크기 제한 · IP별 분당 요청 제한 · 접속 허용 주소(CORS)</text>
  <text x="423" y="210" class="t">POST /analyses (단일 분석)   POST /comparisons (수정 후 재비교)   POST /group-analyses (판매처 비교)</text>
  <text x="423" y="228" class="t">POST /conversation-checks (판매자 대화 확인)   POST /analysis-questions (결과 질의응답)   DELETE /account (회원 탈퇴)</text>

  <!-- Server: pipeline -->
  <rect x="405" y="254" width="370" height="96" rx="14" class="box"/>
  <text x="423" y="280" class="h">1. 자료 준비</text>
  <text x="423" y="304" class="t">• 서버가 판매 페이지 직접 읽기 (scraper)</text>
  <text x="423" y="324" class="t">  또는 수집기·사용자가 보낸 자료 사용</text>
  <text x="423" y="342" class="t">• 반품 안내 페이지 보충 · 대표 사진 주소</text>

  <rect x="795" y="254" width="370" height="96" rx="14" class="boxAi"/>
  <text x="813" y="280" class="h">2. AI 자료 읽기 <tspan class="tag" fill="#A35F00">  생성형 AI</tspan></text>
  <text x="813" y="304" class="t">• 캡처 글자 옮겨 적기</text>
  <text x="813" y="324" class="t">• 상품명·모델명·가격·옵션·상품 상태</text>
  <text x="813" y="342" class="t">• 할인 표시 · 정품/공식 주장 · 인증 마크</text>

  <text x="423" y="378" class="h">3. 동시에 실행하는 확인 (병렬 처리)</text>

  <rect x="405" y="390" width="245" height="132" rx="14" class="box"/>
  <text x="421" y="415" class="h">판매자 확인</text>
  <text x="421" y="439" class="t">• 국세청 사업자 상태</text>
  <text x="421" y="459" class="t">• 통신판매업 신고 대조</text>
  <text x="421" y="479" class="t">• 폐업 후 재등록 · 상호 변경</text>
  <text x="421" y="499" class="t">• 마켓 판매자 평가</text>
  <text x="421" y="515" class="t">• 로켓배송 · 해외 판매자</text>

  <rect x="662" y="390" width="245" height="132" rx="14" class="box"/>
  <text x="678" y="415" class="h">가격 확인</text>
  <text x="678" y="439" class="t">• 같은 모델 새 상품 시세</text>
  <text x="678" y="459" class="t">• 낚시 옵션 (대표가 vs 본품)</text>
  <text x="678" y="479" class="t">• 부풀린 정가 · 할인 기한</text>
  <text x="678" y="499" class="t">• 리퍼·중고 · 병행수입</text>

  <rect x="919" y="390" width="246" height="132" rx="14" class="boxAi"/>
  <text x="935" y="415" class="h">설명 · 리뷰 분석 <tspan class="tag" fill="#A35F00"> AI+규칙</tspan></text>
  <text x="935" y="439" class="t">• 모순 · 과장 · 서두르기 표현</text>
  <text x="935" y="459" class="t">• 마켓 밖 연락 · 계좌 결제 유도</text>
  <text x="935" y="479" class="t">• 리뷰 조작 신호 4종</text>
  <text x="935" y="499" class="t">• 국내/해외 배송 안내 모순</text>
  <text x="935" y="515" class="t">• 근거 문장은 원문 일치만 인정</text>

  <rect x="405" y="534" width="245" height="112" rx="14" class="box"/>
  <text x="421" y="559" class="h">사이트 · 주소 확인</text>
  <text x="421" y="583" class="t">• 도메인 등록일 · 만료</text>
  <text x="421" y="603" class="t">• 서울시 사기 의심 사이트 351곳</text>
  <text x="421" y="623" class="t">• 브랜드 사칭 도메인 36개</text>

  <rect x="662" y="534" width="245" height="112" rx="14" class="box"/>
  <text x="678" y="559" class="h">사진 확인</text>
  <text x="678" y="583" class="t">• 같은 사진 쓰는 페이지 검색</text>
  <text x="678" y="603" class="t">• 공식 사이트 · 해외 저가 마켓</text>
  <text x="678" y="623" class="t">  · 사기 의심 사이트 구분</text>

  <rect x="919" y="534" width="246" height="112" rx="14" class="box"/>
  <text x="935" y="559" class="h">공식 정보 비교</text>
  <text x="935" y="583" class="t">• 삼성 · Apple · LG · 다이슨 · 소니</text>
  <text x="935" y="603" class="t">• 공식 페이지의 상품명·모델·가격</text>
  <text x="935" y="623" class="t">• 동일 상품 여부 판단</text>

  <rect x="405" y="664" width="760" height="62" rx="14" class="box"/>
  <text x="423" y="690" class="h">4. 정품 · 공식 표시 대조</text>
  <text x="423" y="712" class="t">정품·공식 주장과 인증 마크를 판매자 정보·가격·사진과 맞춰 봄 → 판매자가 브랜드 법인일 때만 가산점, 모순이면 주의</text>

  <rect x="405" y="744" width="760" height="86" rx="14" class="boxRule"/>
  <text x="423" y="772" class="hw">5. 판정 규칙 (AI 없이 정해진 규칙 · 규칙 버전 16)</text>
  <text x="423" y="796" class="tw">주의 수준: 높음 · 보통 · 판단 보류 · 낮음   |   신뢰 점수(참고): 확인된 근거의 양을 0~100으로 표시</text>
  <text x="423" y="816" class="tw">결정적 신호(폐업 사업자, 사기 사이트, 마켓 밖 결제 유도)는 '높음' · 확인이 부족하면 '판단 보류'</text>

  <rect x="405" y="848" width="370" height="146" rx="14" class="boxAi"/>
  <text x="423" y="874" class="h">판매자 대화 확인 <tspan class="tag" fill="#A35F00"> AI+규칙</tspan></text>
  <text x="423" y="898" class="t">• 대화 캡처 옮겨 적기 → 사기 수법 문장 찾기</text>
  <text x="423" y="918" class="t">• 계좌 입금 유도 · 안전결제 사칭 · 직원 사칭</text>
  <text x="423" y="938" class="t">  · 환불 미끼 · 인증번호 요구</text>
  <text x="423" y="958" class="t">• 대화 속 링크 → 사이트·주소 확인</text>
  <text x="423" y="978" class="t">• 계좌·번호 가림, 대화는 저장하지 않음</text>

  <rect x="795" y="848" width="370" height="146" rx="14" class="boxAi"/>
  <text x="813" y="874" class="h">결과 질의응답 <tspan class="tag" fill="#A35F00"> 생성형 AI</tspan></text>
  <text x="813" y="898" class="t">• 분석 결과를 번호 붙은 근거로 정리</text>
  <text x="813" y="918" class="t">• 근거 안에서만 답하고 사용한 근거 표시</text>
  <text x="813" y="938" class="t">• 없는 근거 번호는 버림</text>
  <text x="813" y="958" class="t">• 조회 결과는 하루 동안 캐시</text>
  <text x="813" y="978" class="t">  (국세청 · 공정위 · 쇼핑 검색)</text>

  <!-- External -->
  <rect x="1230" y="158" width="320" height="86" rx="14" class="boxAi"/>
  <text x="1248" y="186" class="h">OpenAI API</text>
  <text x="1248" y="210" class="t">상품 정보 추출 · 캡처 글자 인식</text>
  <text x="1248" y="230" class="t">위험 신호 · 대화 분석 · 질의응답</text>

  <rect x="1230" y="258" width="320" height="86" rx="14" class="box"/>
  <text x="1248" y="286" class="h">국세청 사업자 상태 API</text>
  <text x="1248" y="310" class="t">공공데이터포털 · 계속/휴업/폐업 조회</text>
  <text x="1248" y="330" class="t">사업자번호 진위 확인</text>

  <rect x="1230" y="358" width="320" height="96" rx="14" class="box"/>
  <text x="1248" y="386" class="h">공정위 통신판매사업자 자료</text>
  <text x="1248" y="410" class="t">전국 226만 건 (공공데이터 파일)</text>
  <text x="1248" y="430" class="t">신고 조회 · 이력 파일 9.8만 건 내장</text>
  <text x="1248" y="448" class="t">(대표자명은 해시로만 저장)</text>

  <rect x="1230" y="468" width="320" height="86" rx="14" class="box"/>
  <text x="1248" y="496" class="h">Serper (Google 검색)</text>
  <text x="1248" y="520" class="t">쇼핑 시세 · 공식 사이트 검색</text>
  <text x="1248" y="540" class="t">Google Lens 같은 사진 검색</text>

  <rect x="1230" y="568" width="320" height="86" rx="14" class="box"/>
  <text x="1248" y="596" class="h">도메인 등록 정보 (RDAP)</text>
  <text x="1248" y="620" class="t">등록일 · 만료일 조회</text>
  <text x="1248" y="640" class="t">+ 서울시 사기 사이트 목록 내장</text>

  <rect x="1230" y="668" width="320" height="150" rx="14" class="boxTeal"/>
  <text x="1248" y="696" class="h">Supabase</text>
  <text x="1248" y="720" class="t">• 인증: 카카오 · Google 로그인</text>
  <text x="1248" y="742" class="t">• DB(PostgreSQL): 프로필 · 분석 기록</text>
  <text x="1248" y="762" class="t">  · 관심 판매처</text>
  <text x="1248" y="784" class="t">• 행 단위 보안(RLS): 본인 기록만</text>
  <text x="1248" y="806" class="t">• 탈퇴 시 서버가 관리자 키로 삭제</text>

  <rect x="1230" y="832" width="320" height="76" rx="14" class="box"/>
  <text x="1248" y="860" class="h">카카오 · Google 계정</text>
  <text x="1248" y="884" class="t">OAuth 로그인 제공자</text>

  <rect x="1230" y="922" width="320" height="72" rx="14" class="box"/>
  <text x="1248" y="950" class="h">경찰청 사이버캅 (안내만)</text>
  <text x="1248" y="972" class="t">공개 API 없음 → 사용자가 직접 조회</text>

  <!-- Flows: clients to server -->
  <path d="M340 270 C 372 270, 372 200, 405 200" class="lineTeal" marker-end="url(#arrowTeal)"/>
  <path d="M340 465 C 375 465, 375 210, 405 210" class="lineTeal" marker-end="url(#arrowTeal)"/>
  <path d="M340 617 C 380 617, 380 220, 405 220" class="lineTeal" marker-end="url(#arrowTeal)"/>

  <!-- Server internal flow -->
  <path d="M590 236 L590 254" class="line" marker-end="url(#arrow)"/>
  <path d="M775 302 L795 302" class="line" marker-end="url(#arrow)"/>
  <path d="M980 350 L980 368 L785 368 L785 390" class="line" marker-end="url(#arrow)"/>
  <path d="M785 646 L785 664" class="line" marker-end="url(#arrow)"/>
  <path d="M785 726 L785 744" class="line" marker-end="url(#arrow)"/>
  <path d="M785 830 L785 848" class="lineDash"/>

  <!-- Server to external -->
  <path d="M1165 300 C 1200 300, 1200 200, 1230 200" class="line" marker-end="url(#arrow)"/>
  <!-- The checks (step 3) reach the public data and search services. -->
  <path d="M1165 410 C 1200 410, 1200 300, 1230 300" class="line" marker-end="url(#arrow)"/>
  <path d="M1165 430 C 1205 430, 1205 405, 1230 405" class="line" marker-end="url(#arrow)"/>
  <path d="M1165 560 C 1205 560, 1205 510, 1230 510" class="line" marker-end="url(#arrow)"/>
  <path d="M1165 600 C 1205 600, 1205 611, 1230 611" class="line" marker-end="url(#arrow)"/>
  
  <path d="M1165 921 C 1200 921, 1200 200, 1230 200" class="lineDash" marker-end="url(#arrow)"/>
  <path d="M1165 190 C 1195 190, 1195 760, 1230 760" class="lineDash" marker-end="url(#arrow)"/>
  <text x="1170" y="782" class="label">탈퇴 시</text>

  <!-- App to Supabase (login, history) -->
